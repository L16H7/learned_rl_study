[project]
name = "learned-rl-study"
version = "0.1.0"
description = "Small benchmarks of learned reinforcement-learning update rules against hand-written baselines."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # disco_rl uses jax.device_put_replicated / device_put_sharded, which newer JAX releases removed.
    "jax==0.6.2",
    "jaxlib==0.6.2",
    "disco_rl @ git+https://github.com/google-deepmind/disco_rl.git@9059a29f7121d60948f25ef165e08e050e9399c8",
    "gymnasium[box2d]>=1.0",
    "numpy",
    "matplotlib",
    "pillow",
    "minatar>=1.0.15",
]

[tool.uv]
package = false
